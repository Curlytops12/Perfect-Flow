<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0E1220" />
  <title>Perfect Flow</title>
  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; background: #0E1220; }
    body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    * { box-sizing: border-box; }
    #pf-status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; padding: 24px; text-align: center;
      color: #F2F2F2; font-family: -apple-system, Roboto, sans-serif; font-size: 14px;
      background: #0E1220; z-index: 9999;
    }
    #pf-status.hidden { display: none; }
    #pf-status pre {
      white-space: pre-wrap; word-break: break-word; text-align: left;
      background: rgba(255,255,255,0.06); padding: 10px; border-radius: 6px;
      max-width: 100%; max-height: 200px; overflow: auto; font-size: 11px; color: #E5685F;
    }
  </style>
</head>
<body>
  <div id="pf-status">
    <div>Loading Perfect Flow…</div>
    <div style="font-size:12px;color:#8C8C97">If this doesn't disappear in a few seconds, an error is shown below.</div>
    <pre id="pf-error" style="display:none"></pre>
  </div>
  <div id="root"></div>

  <script>
    window.addEventListener('error', function (e) {
      var box = document.getElementById('pf-error');
      box.style.display = 'block';
      box.textContent += (e.message || 'Unknown error') + '\n  at ' + (e.filename || '') + ':' + (e.lineno || '') + '\n';
    });
  </script>

  .sf-root {
    --sf-bg: #0E1220;
    --sf-surface: #1A1A21;
    --sf-surface-2: #24242C;
    --sf-border: #33333D;
    --sf-text: #F2F2F2;
    --sf-muted: #8C8C97;
    --sf-amber: #F2A33D;
    --sf-blue: #3D8BFF;
    --sf-cyan: #00D1FF;
    --sf-green: #5FE3A1;
    --sf-purple: #6B4CFF;
    --sf-red: #E5685F;
    --sf-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --sf-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --sf-mono: ui-monospace, 'SF Mono', Menlo, monospace;
    background:
      radial-gradient(circle at 15% -10%, rgba(107,76,255,0.18), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(0,209,255,0.10), transparent 40%),
      var(--sf-bg);
    color: var(--sf-text);
    font-family: var(--sf-body);
    min-height: 100%;
  }
  .sf-btn {
    background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015));
    border: 1px solid rgba(255,255,255,0.10);
    color: var(--sf-text);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .sf-btn:hover { border-color: var(--sf-blue); }
  .sf-btn:disabled { opacity: 0.35; cursor: default; }
  .sf-btn:focus-visible { outline: 2px solid var(--sf-blue); outline-offset: 2px; }
  .sf-btn-primary {
    background: linear-gradient(135deg, #6B4CFF, #3D8BFF 60%, #00D1FF);
    border: 1px solid rgba(107,76,255,0.6);
    color: #F2F2F2;
    font-weight: 600;
  }
  .sf-btn-primary:hover { background: linear-gradient(135deg, #7E62FF, #4F99FF 60%, #2BDBFF); border-color: #7E62FF; }
  .sf-input, .sf-textarea, .sf-select {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.10);
    color: var(--sf-text);
    border-radius: 6px;
    font-family: var(--sf-body);
  }
  .sf-textarea { font-family: var(--sf-mono); }
  .sf-input:focus, .sf-textarea:focus, .sf-select:focus {
    outline: 2px solid var(--sf-blue);
    outline-offset: 1px;
    border-color: var(--sf-blue);
  }
  .sf-card {
    background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
  }
  .sf-eyebrow {
    font-family: var(--sf-display);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--sf-amber);
  }
  .sf-cue {
    background: rgba(242,163,61,0.12);
    color: var(--sf-amber);
    border: 1px solid rgba(242,163,61,0.35);
    border-radius: 6px;
    padding: 2px 10px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .sf-word {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    margin: 2px 4px 6px;
    cursor: pointer;
    border-radius: 6px;
    padding: 2px 3px;
    border: 1px solid transparent;
    min-height: 50px;
  }
  .sf-word:hover { background: var(--sf-surface-2); }
  .sf-word.has-chord { border-bottom: 2px solid var(--sf-amber); }
  .sf-word .tag-row { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.4; min-height: 11px; }
  .sf-word .chord-row {
    color: var(--sf-amber); font-family: var(--sf-mono); font-weight: 700;
    font-size: 12px; min-height: 14px; line-height: 1;
  }
  .sf-word .lyric-row { font-family: var(--sf-mono); line-height: 1.3; }
  .sf-divider {
    display: flex; align-items: center; gap: 8px;
    color: var(--sf-muted); font-size: 11px;
    padding: 4px 0; opacity: 0.5; cursor: pointer;
  }
  .sf-divider:hover { opacity: 1; color: var(--sf-amber); }
  .sf-divider .line { flex: 1; border-top: 1px dashed var(--sf-border); }
  .sf-join {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: var(--sf-muted); font-size: 11px;
    padding: 8px 0; cursor: pointer; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .sf-join:hover { color: var(--sf-blue); }
  .sf-line-tools {
    display: flex; gap: 4px; opacity: 0.5;
  }
